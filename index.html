
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasco: Friends for you</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #09090b; /* Zinc-950 */
        color: #e4e4e7;
        overflow-x: hidden;
        width: 100%;
        user-select: none;
        -webkit-user-select: none;
      }
      
      #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      
      input, textarea, [contenteditable="true"] {
        user-select: auto;
        -webkit-user-select: auto;
      }
      
      /* --- NEURAL SCROLLBAR --- */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(59, 130, 246, 0.2);
        border-radius: 10px;
        transition: all 0.3s;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.5); }

      /* --- CORE ANIMATIONS (Hardware Accelerated) --- */
      @keyframes neural-float {
        0%, 100% { transform: translateY(0) translateZ(0); }
        50% { transform: translateY(-10px) translateZ(0); }
      }
      .animate-neural-float { 
        animation: neural-float 6s ease-in-out infinite; 
        will-change: transform;
        backface-visibility: hidden;
      }

      @keyframes neural-scan {
        0% { transform: translateY(-100%) translateZ(0); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(100%) translateZ(0); opacity: 0; }
      }
      .animate-scan { 
        animation: neural-scan 3s linear infinite; 
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      @keyframes slide-in-bottom {
        from { transform: translateY(20px) translateZ(0); opacity: 0; }
        to { transform: translateY(0) translateZ(0); opacity: 1; }
      }
      .animate-slide-in { 
        animation: slide-in-bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in { 
        animation: fade-in 0.5s ease-out forwards; 
        will-change: opacity;
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px) translateZ(0); }
        to { opacity: 1; transform: translateY(0) translateZ(0); }
      }
      .animate-fade-in-up { 
        animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      @keyframes shine {
        from { transform: translateX(-100%) skewX(-15deg) translateZ(0); }
        to { transform: translateX(200%) skewX(-15deg) translateZ(0); }
      }
      .animate-shine { 
        animation: shine 3s infinite; 
        will-change: transform;
      }

      @keyframes pulse-slow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .animate-pulse-slow { 
        animation: pulse-slow 4s ease-in-out infinite; 
        will-change: opacity;
      }

      /* --- NEW ANIMATIONS (Hardware Accelerated) --- */
      @keyframes glitch {
        0% { transform: translate(0) translateZ(0); }
        20% { transform: translate(-2px, 2px) translateZ(0); }
        40% { transform: translate(-2px, -2px) translateZ(0); }
        60% { transform: translate(2px, 2px) translateZ(0); }
        80% { transform: translate(2px, -2px) translateZ(0); }
        100% { transform: translate(0) translateZ(0); }
      }
      .animate-glitch { 
        animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; 
        will-change: transform;
        backface-visibility: hidden;
      }

      @keyframes holo-scan {
        0% { transform: translateY(-10%) translateZ(0); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(110%) translateZ(0); opacity: 0; }
      }
      .animate-holo-scan { 
        animation: holo-scan 2.5s ease-in-out infinite; 
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      /* Force GPU for all glass surfaces and heavy containers */
      .gpu-accelerated {
        transform: translateZ(0);
        backface-visibility: hidden;
        perspective: 1000;
        will-change: transform;
      }

      .glass-surface {
        background: rgba(9, 9, 11, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transform: translateZ(0); /* Force GPU compositing */
      }

      /* PERFORMANCE MODES */
      .fast-animations *, .fast-animations *::before, .fast-animations *::after {
        transition-duration: 0.15s !important;
        animation-duration: 0.3s !important;
      }
      .disable-blur * {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .disable-blur .glass-surface, .disable-blur .bg-zinc-950\/80 {
        background-color: rgba(9, 9, 11, 0.95) !important;
      }

      /* Custom utility for vertical writing */
      .writing-vertical-lr {
        writing-mode: vertical-lr;
      }
      
      /* Smooth transitions for all elements */
      * { 
        transition: border-color 0.2s, background-color 0.2s; 
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      img {
        image-rendering: -webkit-optimize-contrast;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "jszip": "https://esm.sh/jszip@^3.10.1",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
